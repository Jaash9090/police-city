<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Police City — Harsh Aryan & Kittu</title><style>body{margin:0;background:#101c30;color:white;font-family:system-ui;overflow:hidden}#intro{position:fixed;inset:0;z-index:9;background:linear-gradient(130deg,#0b1428,#204d75);display:grid;place-content:center;text-align:center;padding:25px}h1{font-size:clamp(32px,7vw,75px);margin:0}p{line-height:1.6}button{background:#ffd05a;border:0;border-radius:12px;padding:14px 24px;font-weight:bold;font-size:17px;cursor:pointer}#hud{position:fixed;top:12px;left:12px;background:#071a2dc9;padding:14px;border-radius:12px;z-index:2}#controls{position:fixed;bottom:20px;left:15px;z-index:3;display:flex;gap:8px}#controls button{padding:12px}#swap{position:fixed;bottom:20px;right:15px;z-index:3}canvas{display:block}</style><div id="intro"><h1>POLICE CITY</h1><h2>FAMILY SQUAD</h2><h3>Created by Harsh Aryan & Kittu</h3><p>This is a fictional 3D game. It is not real life.<br>यह एक काल्पनिक गेम है, वास्तविक जीवन नहीं।</p><button id="go">START GAME</button></div><div id="hud">🚓 Police City: Family Squad<br><span id="who">Officer</span><br><small>WASD / arrows to move · C to change character</small></div><div id="controls"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="swap">Change character</button><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7ed);scene.fog=new THREE.Fog(0x9bc7ed,60,145);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x6a8199,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,40,15);scene.add(sun);function cube(w,h,d,c,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));o.position.set(x,y,z);scene.add(o);return o}cube(240,.2,240,0x5a9861,0,-.2,0);for(let i=-4;i<=4;i++){cube(220,.05,7,0x333943,0,.02,i*24);cube(7,.05,220,0x333943,i*24,.03,0)}for(let x=-4;x<=4;x++)for(let z=-4;z<=4;z++){if(Math.abs(x)<1&&Math.abs(z)<1)continue;let h=5+((Math.abs(x*7+z*13)%8)*2);cube(10,h,10,new THREE.Color().setHSL((x+z+12)/35,.25,.45),x*24+11,h/2,z*24+11)}const colors=[0x1d4e9c,0xbd3434,0x6a42a0,0xdba23b,0x1594a0,0x287c4d,0xe07e56,0x725ab4,0x444444,0x327ab0,0x6e9c36,0xa9477d,0xd59c35,0x307c8e,0xa45b42,0x485bb1];let players=[];for(let i=0;i<16;i++){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.55,1.45,10),new THREE.MeshLambertMaterial({color:colors[i]}));body.position.y=1.25;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),new THREE.MeshLambertMaterial({color:0xc58b63}));head.position.y=2.35;g.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.44,16,8,0,Math.PI*2,0,Math.PI*.46),new THREE.MeshLambertMaterial({color:0x29211e}));hair.position.y=2.46;g.add(hair);let eyeMat=new THREE.MeshLambertMaterial({color:0x1c1616});for(let a of [-.17,.17]){let e=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),eyeMat);e.position.set(a,2.39,-.395);g.add(e)}g.position.set(i%4*3-5,0,Math.floor(i/4)*3-5);scene.add(g);players.push(g)}let selected=0;let keys={};function change(){selected=(selected+1)%players.length;document.getElementById('who').textContent='Character '+(selected+1)+' / 16'}document.getElementById('swap').onclick=change;document.getElementById('go').onclick=()=>document.getElementById('intro').remove();addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='c')change()});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});for(let t of ['pointerup','pointercancel','pointerleave'])b.addEventListener(t,()=>keys[k]=false)});let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05),p=players[selected],dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dz=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);p.position.x+=dx*dt*8;p.position.z+=dz*dt*8;if(dx||dz)p.rotation.y=Math.atan2(-dx,-dz);camera.position.lerp(new THREE.Vector3(p.position.x+9,12,p.position.z+15),.08);camera.lookAt(p.position.x,1,p.position.z);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></html>
