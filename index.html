<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta charset="utf-8"><title>Harsh & Kittu Subway Run</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui;background:#91d9fa;color:white}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;text-shadow:1px 2px #233}#hud span{background:#13284ca9;padding:9px 14px;border-radius:15px;font-weight:900}#overlay{position:fixed;inset:0;background:linear-gradient(145deg,#10234cd9,#234f79df);display:grid;place-items:center;z-index:5;text-align:center;padding:25px}#panel{max-width:460px}h1{font-size:clamp(40px,9vw,75px);line-height:1;margin:0;color:#ffd852;text-shadow:4px 5px #ff6840}h2{font-size:27px}p{line-height:1.5}button{border:0;background:#ffcc38;border-bottom:5px solid #d47c21;border-radius:18px;padding:15px 32px;font-size:22px;font-weight:900;color:#192d51;cursor:pointer}#touch{position:fixed;bottom:12px;width:100%;display:flex;justify-content:space-between;padding:0 18px;z-index:3;pointer-events:none}#touch button{pointer-events:auto;padding:11px 17px;font-size:20px;opacity:.7}</style></head><body><div id="hud"><span id="score">SCORE 0</span><span id="coins">🪙 0</span><span id="best">BEST 0</span></div><div id="overlay"><div id="panel"><h1>SUBWAY RUN</h1><h2>HARSH & KITTU</h2><p>🏃 RUN • 🚓 POLICE CHASE • 🪙 COLLECT COINS</p><p>Created by Harsh Aryan & Kittu</p><p>This is a fictional game, not real life.<br>यह एक काल्पनिक गेम है, वास्तविक जीवन नहीं।</p><p>Swipe left/right to dodge, up to jump, down to slide.<br>Keyboard: ← → ↑ ↓</p><button id="start">▶ START RUN</button></div></div><div id="touch"><div><button data-act="left">◀</button><button data-act="right">▶</button></div><div><button data-act="jump">⬆</button><button data-act="slide">⬇</button></div></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new T.Scene();scene.background=new T.Color(0x87d4fc);scene.fog=new T.Fog(0x87d4fc,35,110);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,160);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x6582ad,2.1));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(-15,30,10);scene.add(light);function block(w,h,d,c,x,y,z,parent=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));o.position.set(x,y,z);parent.add(o);return o}block(150,.2,220,0x7ec967,0,-.2,-35);for(let i=-1;i<=1;i++){block(2.75,.1,180,0x777d88,i*3,0,-40);for(let x of [-1,1])block(.13,.13,180,0xcbd2db,i*3+x*.95,.13,-40)}const sleepers=[];for(let z=5;z>-115;z-=3)for(let i=-1;i<=1;i++)sleepers.push(block(2.6,.08,.22,0x584637,i*3,.11,z));const scenery=[];for(let z=8;z>-115;z-=13)for(let x of [-12,12]){let h=7+Math.abs(Math.sin(z*x))*13;scenery.push(block(7,h,9,new T.Color().setHSL((Math.abs(z)%45)/65,.48,.54),x,h/2,z))}const player=new T.Group();scene.add(player);block(.85,1.25,.48,0x161d2a,0,1.15,0,player);const head=new T.Mesh(new T.SphereGeometry(.38,14,12),new T.MeshLambertMaterial({color:0xc58b64}));head.position.y=2.05;player.add(head);const glasses=block(.82,.23,.16,0x10141c,0,2.12,-.34,player);const bridge=block(.2,.06,.18,0x252525,0,2.12,-.43,player);const faceMat=new T.MeshBasicMaterial({map:new T.TextureLoader().load('./runner-face.jpg'),transparent:true,side:T.DoubleSide});const faceCard=new T.Mesh(new T.PlaneGeometry(.7,.7),faceMat);faceCard.position.set(0,2.08,.35);player.add(faceCard);block(.84,.22,.75,0x222633,0,2.34,0,player);block(.8,.2,.16,0x101116,0,2.1,-.37,player);block(.14,.08,.2,0x999999,0,2.1,-.42,player);const legs=[],arms=[];for(let x of [-.23,.23]){const leg=block(.3,.85,.36,0x25354b,x,.43,0,player);legs.push(leg);const arm=block(.27,.8,.32,0xd8a073,x*.0+.58*Math.sign(x),1.14,0,player);arms.push(arm)}const officer=new T.Group();scene.add(officer);block(1.05,1.25,.7,0x143d7a,0,1.2,0,officer);const ph=new T.Mesh(new T.SphereGeometry(.41,14,12),new T.MeshLambertMaterial({color:0xb7774b}));ph.position.y=2.12;officer.add(ph);block(.92,.2,.84,0x12316c,0,2.46,0,officer);block(.52,.1,.2,0xf5c43e,0,2.51,-.36,officer);block(.55,.13,.1,0x33241e,0,1.96,-.39,officer);for(let x of [-.29,.29]){block(.37,.8,.4,0x17345f,x,.45,0,officer);block(.27,.8,.3,0x143d7a,x*2.5,1.15,0,officer)}officer.position.set(0,0,5);const items=[];function spawn(){let lane=Math.floor(Math.random()*3)-1,z=-90,kind=Math.random()<.36?'coin':Math.random()<.55?'train':'barrier',g=new T.Group();g.position.set(lane*3,0,z);scene.add(g);if(kind==='coin'){let coin=new T.Mesh(new T.TorusGeometry(.48,.16,8,16),new T.MeshLambertMaterial({color:0xffce27}));coin.position.y=1.25;g.add(coin)}else if(kind==='train'){block(2.6,4.2,7,0xe44b43,0,2.1,0,g);block(2.15,1.2,.12,0x9de4ff,0,2.9,3.56,g);block(2.1,.22,.2,0xffcf3c,0,1.1,3.58,g);for(let xx of [-.85,.85])block(.32,.3,.1,0xffe0a2,xx,.55,3.58,g)}else{block(2.6,1.1,.55,0xff9e23,0,.6,0,g);block(2.7,.18,.65,0xffffff,0,1.2,0,g)}items.push({g,kind,lane,hit:false})}let lane=0,vy=0,y=0,slide=0,score=0,coins=0,speed=19,playing=false,spawnTime=0,last=performance.now(),best=Number(localStorage.getItem('hk-run-best')||0);document.getElementById('best').textContent='BEST '+best;function action(a){if(!playing)return;if(a==='left')lane=Math.max(-1,lane-1);if(a==='right')lane=Math.min(1,lane+1);if(a==='jump'&&y<.05)vy=10;if(a==='slide')slide=.8}addEventListener('keydown',e=>{const a={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'slide',a:'left',d:'right',w:'jump',s:'slide'}[e.key];if(a){e.preventDefault();action(a)}});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)action(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide')});function finish(){playing=false;best=Math.max(best,Math.floor(score));localStorage.setItem('hk-run-best',best);document.getElementById('overlay').style.display='grid';document.getElementById('panel').innerHTML='<h1>POLICE CAUGHT YOU!</h1><h2>Score: '+Math.floor(score)+'</h2><p>Coins: '+coins+' · Best: '+best+'</p><p>Created by Harsh Aryan & Kittu</p><button id="again">↻ PLAY AGAIN</button>';document.getElementById('again').onclick=start}function start(){items.forEach(o=>scene.remove(o.g));items.length=0;lane=0;y=0;vy=0;slide=0;score=0;coins=0;speed=19;spawnTime=1.7;playing=true;document.getElementById('overlay').style.display='none'}document.getElementById('start').onclick=start;function frame(t){requestAnimationFrame(frame);let dt=Math.min((t-last)/1000,.05);last=t;if(playing){for(const building of scenery){building.position.z+=speed*dt;if(building.position.z>18)building.position.z-=130;}for(const sleeper of sleepers){sleeper.position.z+=speed*dt;if(sleeper.position.z>10)sleeper.position.z-=120;}score+=dt*speed*.7;speed=Math.min(38,19+score/220);spawnTime-=dt;if(spawnTime<=0){spawn();spawnTime=Math.max(.55,1.25-score/1800)}vy-=24*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0;slide=Math.max(0,slide-dt);player.position.x+=(lane*3-player.position.x)*Math.min(1,dt*13);player.position.y=y;officer.position.x+=(player.position.x-officer.position.x)*Math.min(1,dt*3.5);officer.position.z=3.8+Math.sin(t/200)*.16;officer.rotation.z=Math.sin(t/135)*.07;const stride=t*.018;legs.forEach((leg,i)=>{leg.rotation.x=Math.sin(stride+i*Math.PI)*.85;leg.position.y=.5+Math.max(0,Math.sin(stride+i*Math.PI))*.12;});arms.forEach((arm,i)=>{arm.rotation.x=-Math.sin(stride+i*Math.PI)*.8;});player.position.z=Math.sin(stride*2)*.05;player.rotation.z=Math.sin(t/120)*.045;player.rotation.x=y>0?-.12:Math.sin(t/100)*.055;officer.rotation.x=Math.sin(t/110)*.06;player.scale.y=slide>0?.57:1;for(let i=items.length-1;i>=0;i--){let o=items[i];o.g.position.z+=speed*dt;if(o.kind==='coin')o.g.rotation.y+=dt*5;if(!o.hit&&Math.abs(o.g.position.z)<1.2&&Math.abs(o.g.position.x-player.position.x)<1.1){o.hit=true;if(o.kind==='coin'){coins++;score+=25;scene.remove(o.g);items.splice(i,1);continue}else if(o.kind==='train'||(y<.9&&slide<=0)){finish();break}}if(o.g.position.z>12){scene.remove(o.g);items.splice(i,1)}}document.getElementById('score').textContent='SCORE '+Math.floor(score);document.getElementById('coins').textContent='🪙 '+coins}camera.position.lerp(new T.Vector3(player.position.x*.35,5.1,12),.09);camera.lookAt(player.position.x*.5,1.35,-9);renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
